# Folia API version used to build ALL plugins.
# When updating the server, change it here (see docs/OPERATIONS.md).
foliaApiVersion=26.3.build.6-alpha
# Goes into the api-version of each plugin's plugin.yml.
minecraftApiVersion=26.3

# The build runs on the same machine as the server: cap Gradle's memory.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true
