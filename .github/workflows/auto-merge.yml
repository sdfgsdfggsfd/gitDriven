# Enables auto-merge (squash) on every opened PR. GitHub only merges once the
# branch ruleset allows it: approval from a CODEOWNER + a green "build" check.
# Result: approved PR = merged PR = Core updates the server.
#
# Safe with pull_request_target because it does NOT check out or run any code from the PR.
name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash
